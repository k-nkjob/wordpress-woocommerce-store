name: Plugin Syntax Check

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find knkjob-store-customizer -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: |
          find knkjob-store-customizer -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Package plugin
        run: |
          zip -r knkjob-store-customizer.zip knkjob-store-customizer

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: knkjob-store-customizer
          path: knkjob-store-customizer.zip
          if-no-files-found: error
